<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Raio D'Água</title>
    <meta name="description"
      content="Entre em contato com a Raio D'Água para saber mais sobre nossas aventuras de rafting, fazer perguntas ou enviar sugestões.">
    <meta name="author" content="Sasha Suxel Irais Hernandez Villalobos">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/rafting-logotipo.jpg" alt="logotipo do site de rafting">
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>

        </nav>
    </header>
    <main>
        <h1>Raio D'Água</h1>

        <section class="informacoes-contato">
            <p><strong>Informações de Contato</strong></p>
            <p>Endereço: Rua das Águas, 123, Curitiba, Paraná</p>
            <p>Telefone: (41) 3324-5823</p>
            <p>E-mail: contato@raiodagua.com</p>
        </section>

        <section class="contato-principal">

            <div class="mapa">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d230483.05208082148!2d-49.2897982!3d-25.4951166!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94dce35351cdb3dd%3A0x6d2f6ba5bacbe809!2sCuritiba%2C%20PR!5e0!3m2!1spt-BR!2sbr!4v1791057564490!5m2!1spt-BR!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <div class="formulario-contato">
                <h2>Envie uma Mensagem</h2>

                <form>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <p>Finalidade da mensagem:</p>

                    <label>
                        <input type="radio" name="finalidade" value="consulta-geral">
                        Consulta Geral
                    </label>

                    <label>
                        <input type="radio" name="finalidade" value="pergunta-reserva">
                        Pergunta sobre Reserva
                    </label>

                    <label>
                        <input type="radio" name="finalidade" value="sugestao-site">
                        Sugestão de Site
                    </label>

                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                    <label>
                        <input type="checkbox" name="newsletter">
                        Quero receber a newsletter mensal
                    </label>

                    <button type="submit">Enviar Mensagem</button>
                </form>
            </div>

        </section>

        <section class="funcionarios">
            <h2>Nossa Equipe</h2>

            <figure>
                <img src="imagens/funcionario1.jpg" alt="Ana Silva, instrutora de rafting">
                <figcaption>Ana Silva — Instrutora de Rafting</figcaption>
            </figure>

            <figure>
                <img src="imagens/funcionario2.jpg" alt="Carlos Santos, guia de rafting">
                <figcaption>Carlos Santos — Guia de Rafting</figcaption>
            </figure>

            <figure>
                <img src="imagens/funcionario3.jpg" alt="Mariana Costa, gerente da empresa">
                <figcaption>Mariana Costa — Gerente</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p>© 2026 Raio D'Água | Sasha Hernandez</p>
        <nav class="redes-sociais socialmedia">
            <a href="https://facebook.com">
                <img src="imagens/facebook.svg" alt="">
            </a>
            <a href="https://instagram.com">
                <img src="imagens/instagram.svg" alt="">
            </a>
            <a href="https://whatsapp.com">
                <img src="imagens/whatsapp.svg" alt="">
            </a>
        </nav>
    </footer>
</body>

</html>
