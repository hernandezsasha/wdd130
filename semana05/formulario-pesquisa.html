<!DOCTYPE html>
<HTMl lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Formulário HTML - Pesquisa de Usúario</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>
    <header>
        <h1>WDD 130 | Formulário HTML - Pesquisa de Usuário</h1>
    </header>
    <main>
        <form>
            <div class="item-formulario coluna2">
                <label for="nome-completo">Nome Completo:</label>
                <input type="text" name="nome-completo" id="nome-completo" required>
            </div>
            <div class="item-formulario coluna2">
                <label for="emaildousuario">E-mail:</label>
                <input type="email" id="email-do-usuario" name="email-do-usuario" required>
            </div>
            <div class="item-formulario coluna1">
                <label for="navegador">Qual é o seu navegador favorito?</label>
                <select name="navegador" id="navegador">
                    <option value="1">Crhome</option>
                    <option value="2">Safari</option>
                    <option value="3">Edge</option>
                </select>
            </div>
            <div class="item-formulario coluna1 ">
                <label for="pet">Você tem um bichinho de estimação em casa?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="item-formulario feedback">
                <label for="feedback">Liste os lugares onde você morou:</label>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="Stillwater, Amsterdã Holanda, Tibuktu Mali "></textarea>
            </div>

            <button type="submit">Enviar Pesquisa</button>

        </form>

    </main>
    <footer>
        <p> © 2026 | Formulário HTMl</p>

    </footer>
</body>

</html>
